# Entry config for the export stage: `uv run python -m angel_ai.optimize.export`
defaults:
  - backend: auto
  - model: qwen2_5_0_5b
  - training: lora
  - data: tiny
  - optimize: export
  - _self_

seed: 42
output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

hydra:
  run:
    dir: ${output_dir}/hydra
  job:
    chdir: false
