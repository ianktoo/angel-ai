[project]
name = "angel-ai"
version = "0.1.0"
description = "Hardware-agnostic LLM finetuning, optimization, and evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "transformers>=4.46,<5", # torch-directml pins torch~=2.4, which transformers 5.x drops support for
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "mlflow>=2.16",
  "optuna>=4.0",
  "rich>=13.9",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
]

[project.optional-dependencies]
directml = ["torch-directml>=0.2.0"]
cuda = ["torch>=2.4"]
cpu = ["torch>=2.4"]
npu-inference = ["onnxruntime-genai>=0.4", "onnx>=1.17", "optimum>=1.23"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-mock>=3.14",
  "ruff>=0.7",
]

[project.scripts]
angel-ai = "angel_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/angel_ai"]

[tool.pytest.ini_options]
markers = [
  "slow: end-to-end smoke tests that load a real model/backend",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
